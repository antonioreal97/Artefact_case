# Owner of app/worker/migrate services: Task B. db/redis defined by the orchestrator.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio  # local dev only
      POSTGRES_DB: emporio
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
